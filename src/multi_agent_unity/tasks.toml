[sidescroller.empty]
task = """
Create a side-scroller game. In it, the Player talks to an NPC, who asks them to defeat an Enemy. When the
Player returns to the NPC after defeating the Enemy, the NPC gives them a key,
which opens a Door. The Player wins by reaching the Goal once the Enemy is defeated
and the Door is open. The Enemy patrols and hurts the Player on contact, and a
health bar shows the Player's health. A Wall to the left of the Player blocks its
way.

The automated tests rely on these names and behaviours:
- Player GameObject with a PlayerMover script containing Move(Vector2 input),
  Jump(Vector2 input) and Attack() (which damages the Enemy within 2 units), a
  health field, and a hasKey field that becomes true when the NPC gives the key.
- NPC GameObject with an NPC script containing Interact(), Advance() and a
  dialogueFinished field. Interact() works within 2 units of the Player and opens
  a UI panel named DialogueBox showing a dialogue of at least two lines.
- Enemy GameObject with an Enemy script containing a health field and a
  TakeDamage(int amount) method. The Enemy is removed when its health reaches zero.
- Door GameObject that opens when the Player touches it while hasKey is true.
- Goal GameObject, and a LevelManager GameObject with a LevelManager script
  containing a winCondition field.
- Wall GameObject, and a Ground GameObject the Player stands on under gravity.
- A UI Slider named HealthBar, anchored to the top-left of the screen, whose
  value always equals the Player's health.

Write all scripts to Assets/MultiAgentBridge/Working/Scripts/. Use the list_sprites tool
for any sprites you need. The game will be evaluated both by these tests, which call
your methods directly, and by a human playing it, so it must be playable and your
methods must work when called externally.
Build only what is described: do not add camera scripts, menus, restart controls,
on-screen messages or other extra features. Work efficiently and complete the task
in as few steps as possible. Do not write test scripts, verification scripts, demo
scripts, or documentation files.
"""


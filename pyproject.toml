[project]
name = "multi-agent-unity"
version = "0.1.0"
description = "A multi-agent LLM assistant for Unity game development"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_unity"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100